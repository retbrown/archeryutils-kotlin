name: Release

# Publishes all Kotlin Multiplatform artifacts (Android, JVM and iOS) to GitHub Packages
# when a semver tag such as v3.0.1 is pushed. iOS artifacts can only be built on macOS.
on:
  push:
    tags:
    - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v4
    - name: Check tag matches VERSION_NAME
      run: |
        version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
        if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME=$version in gradle.properties" >&2
          exit 1
        fi
    - name: Run tests
      run: ./gradlew jvmTest testAndroidHostTest iosSimulatorArm64Test
    - name: Publish
      run: ./gradlew publish
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
