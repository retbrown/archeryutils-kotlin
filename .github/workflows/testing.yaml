name: Testing

on:
  push:
    branches:
    - main
  pull_request:
    types:
    - synchronize
    - opened
    - reopened

jobs:
  jvm-test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v4
    - name: Run tests
      run: ./gradlew jvmTest testAndroidHostTest
    - name: Check coverage
      run: ./gradlew koverVerify
    - name: Check KDoc (fails on undocumented public API)
      run: ./gradlew dokkaGenerate

  ios-test:
    name: iOS simulator tests
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v4
    - name: Run tests
      run: ./gradlew iosSimulatorArm64Test
